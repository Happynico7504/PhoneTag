name: build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository variable: raise it if the workflow is ever recreated and run numbers
      # restart, so version codes keep increasing (Android only installs higher codes in place).
      PHONETAG_VERSION_CODE_OFFSET: ${{ vars.PHONETAG_VERSION_CODE_OFFSET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONETAG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PHONETAG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No PHONETAG_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and can't update an existing install in place. See 'Releasing the app' in the README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test, build server and release APK
        env:
          PHONETAG_KEYSTORE_PASSWORD: ${{ secrets.PHONETAG_KEYSTORE_PASSWORD }}
          PHONETAG_KEY_ALIAS: ${{ secrets.PHONETAG_KEY_ALIAS }}
        run: ./gradlew :core:test :app:testDebugUnitTest :server:installDist :app:assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          code=$((GITHUB_RUN_NUMBER + ${PHONETAG_VERSION_CODE_OFFSET:-0}))
          name="phonetag-0.1.$code"
          cp app/build/outputs/apk/release/app-release.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### PhoneTag APK"
            echo "- Version code: **$code** (name 0.1.$code)"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Signed with the release key: installs over any previous signed build in place."
            else
              echo "- ⚠️ Not signed with the release key: players must uninstall before installing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
